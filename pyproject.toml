[project]
name = "telegrammusicbot"
version = "1.2.0"
description = "A Telegram Music Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]

[tool.ruff]
src = ["."]
exclude = [
    ".git",
    "__pycache__",
    "scripts",
    "build",
    "dist",
]
line-length = 79
fix = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001"]

[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.poe.tasks]
run = "python main.py"

format = "ruff format ."
lint = "ruff check ."
type-check = "pyright ."

check = [
    "format",
    "lint",
    "type-check",
]